[project]
name = "gsheet-stock-price-updater"
version = "0.1.0"
description = "Config-driven CLI that fetches stock prices and writes price + currency into a Google Sheet."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Tomas Hozza" }]
keywords = ["stocks", "google-sheets", "gspread", "price", "quotes"]

dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
    "lxml>=5.2,<7",
    "gspread>=6.1,<7",
    "google-auth>=2.30,<3",
]

[project.scripts]
gsheet-stock-price-updater = "gsheet_stock_price_updater.__main__:main"

[project.urls]
Homepage = "https://github.com/thozza/gsheet-stock-price-updater"
Repository = "https://github.com/thozza/gsheet-stock-price-updater"

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsheet_stock_price_updater"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
packages = ["gsheet_stock_price_updater"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

# lxml ships no type information; the scrape providers use it directly.
[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true
